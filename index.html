<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Durga Puja!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .card {
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 380px;
      width: 100%;
      border: 3px solid #ff4b2b;
    }
    h2 { color: #ff416c; margin-bottom: 5px; }
    h1 { color: #b20a2c; margin: 15px 0; }
    .name { font-size: 26px; color: #ff4b2b; font-weight: bold; }
    input {
      width: 80%;
      padding: 10px;
      margin: 15px 0;
      border: 2px solid #ff4b2b;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
    }
    .btn {
      background: #25D366;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="name" id="userName">Aapke Dost</div>
    <p style="margin: 5px 0; color: #555;">ki taraf se aapko</p>
    <h1>🌸 Happy Durga Puja! 🌸</h1>
    <p style="color: #444; line-height: 1.5;">Maa Durga aapke jeevan me sukh, shanti aur samriddhi layein!</p>
    <hr style="margin: 20px 0; border: 0.5px dashed #ccc;">
    <p style="font-size: 14px; color: #666;">Aap bhi apne naam se bhejein:</p>
    <input type="text" id="inputName" placeholder="Apna Naam Likhein">
    <br>
    <button class="btn" onclick="share()">WhatsApp Par Bhejein</button>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const sender = params.get('name');
    if (sender) {
      document.getElementById('userName').innerText = decodeURIComponent(sender);
    }
    function share() {
      const name = document.getElementById('inputName').value.trim();
      if (!name) { alert("Pehle apna naam likhein!"); return; }
      const url = window.location.origin + window.location.pathname + '?name=' + encodeURIComponent(name);
      const text = `✨ ${name} ne aapke liye ek shubhkaamna sandesh bheja hai! Dekhne ke liye click karein:\n${url}`;
      window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(text), '_blank');
    }
  </script>
</body>
</html>
